[project]
name = "price-watch"
version = "0.1.0"
description = "MercadoLibre price tracker with Telegram notifications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "python-telegram-bot>=21",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
